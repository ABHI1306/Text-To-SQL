services:
  metadata-db:
    image: docker.io/library/postgres:16.15
    environment:
      POSTGRES_DB: metadata
      POSTGRES_USER: metadata_admin
      POSTGRES_PASSWORD: ${METADATA_ADMIN_PASSWORD:?Set METADATA_ADMIN_PASSWORD in .env}
      METADATA_APP_PASSWORD: ${METADATA_APP_PASSWORD:?Set METADATA_APP_PASSWORD in .env}
    ports:
      - "${METADATA_HOST_PORT:-55432}:5432"
    volumes:
      - metadata-data:/var/lib/postgresql/data
      - ./scripts/db/init-metadata.sql:/docker-entrypoint-initdb.d/10-init-metadata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata_admin -d metadata"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [local]

  demo-db:
    image: docker.io/library/postgres:16.15
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo_admin
      POSTGRES_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?Set WAREHOUSE_READER_PASSWORD in .env}
    ports:
      - "${DEMO_HOST_PORT:-55433}:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
      - ./scripts/db/init-demo.sql:/docker-entrypoint-initdb.d/10-init-demo.sql:ro
      - ./scripts/db/grants.sql:/docker-entrypoint-initdb.d/grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_admin -d demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [local]

  qdrant:
    image: docker.io/qdrant/qdrant:v1.15.4
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [local]

  ollama:
    image: docker.io/ollama/ollama:0.12.6
    volumes:
      - ollama-data:/root/.ollama
    networks: [local]

  api:
    build:
      context: .
      target: base
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      METADATA_DATABASE_URL: postgresql+psycopg://text2sql_app:${METADATA_APP_PASSWORD}@metadata-db:5432/metadata
      WAREHOUSE_DSN: "host=demo-db port=5432 dbname=demo user=warehouse_reader password=${WAREHOUSE_READER_PASSWORD}"
      WAREHOUSE_STATEMENT_TIMEOUT_MS: ${WAREHOUSE_STATEMENT_TIMEOUT_MS:-10000}
      WAREHOUSE_MAX_ROWS: ${WAREHOUSE_MAX_ROWS:-1000}
      JWT_SECRET: ${JWT_SECRET:-}
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:-}
      BOOTSTRAP_DBA_USERNAME: ${BOOTSTRAP_DBA_USERNAME:-}
      BOOTSTRAP_DBA_PASSWORD: ${BOOTSTRAP_DBA_PASSWORD:-}
      DB_HOST_ALLOWLIST: ${DB_HOST_ALLOWLIST:-demo-db,localhost,127.0.0.1}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-28800}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      SQL_MODEL: ${SQL_MODEL:-llama3:latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-text2sql}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      metadata-db:
        condition: service_healthy
      demo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "__import__('urllib.request').request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [local]

  worker:
    build:
      context: .
      target: base
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      METADATA_DATABASE_URL: postgresql+psycopg://text2sql_app:${METADATA_APP_PASSWORD}@metadata-db:5432/metadata
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:-}
      WAREHOUSE_STATEMENT_TIMEOUT_MS: ${WAREHOUSE_STATEMENT_TIMEOUT_MS:-10000}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-15}
      SCHEDULER_LEASE_SECONDS: ${SCHEDULER_LEASE_SECONDS:-300}
      SCHEDULER_WORKER_ID: ${SCHEDULER_WORKER_ID:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-text2sql}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    depends_on:
      metadata-db:
        condition: service_healthy
      demo-db:
        condition: service_healthy
    networks: [local]

  openldap:
    image: docker.io/osixia/openldap:1.5.0
    profiles: ["identity-demo"]
    hostname: ldap.example.org
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: svc-text2sql
      LDAP_READONLY_USER_PASSWORD: ${LDAP_SERVICE_PASSWORD:-}
      LDAP_TLS: "true"
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_DH_PARAM_FILENAME: dhparam.pem
    volumes:
      - ./scripts/ldap/certs:/container/service/slapd/assets/certs
      - ./scripts/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-demo.ldif:ro
    networks:
      local:
        aliases: [ldap.example.org]

  migrate:
    build:
      context: .
      target: base
    profiles: ["tools"]
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      METADATA_MIGRATION_URL: postgresql+psycopg://metadata_admin:${METADATA_ADMIN_PASSWORD}@metadata-db:5432/metadata
    depends_on:
      metadata-db:
        condition: service_healthy
    networks: [local]

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    command: ["uv", "run", "--no-sync", "pytest", "-q"]
    environment:
      WAREHOUSE_DSN: "host=demo-db port=5432 dbname=demo user=warehouse_reader password=${WAREHOUSE_READER_PASSWORD}"
      METADATA_APP_DSN: "host=metadata-db port=5432 dbname=metadata user=text2sql_app password=${METADATA_APP_PASSWORD}"
    depends_on:
      metadata-db:
        condition: service_healthy
      demo-db:
        condition: service_healthy
    networks: [local]

volumes:
  metadata-data:
  demo-data:
  qdrant-data:
  ollama-data:

networks:
  local:
    internal: true