# Enables OpenID Connect login in the api against the identity-demo Keycloak container:
#   set OIDC_CLIENT_SECRET (a long random value) and KEYCLOAK_ADMIN_PASSWORD in .env, then
#   docker compose -f docker-compose.yml -f docker-compose.oidc.yml --profile identity-demo up -d
# Browse to http://localhost:8000/api/v1/auth/oidc/login. Demo users (asha, ravi, mina) are in
# scripts/oidc/realm-text2sql.json; map their groups with PUT /identity/mappings (source "oidc"),
# e.g. text2sql-analysts -> Analyst, text2sql-dbas -> DBA.
# Keycloak is published on host port 8081 so the browser and the issuer URL agree; the api
# reaches it as keycloak:8080 through the "edge" network (KC_HOSTNAME_BACKCHANNEL_DYNAMIC).
services:
  api:
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/text2sql
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/text2sql/.well-known/openid-configuration
      OIDC_CLIENT_ID: text2sql-api
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
      OIDC_REDIRECT_URI: http://localhost:8000/api/v1/auth/oidc/callback
      OIDC_GROUPS_CLAIM: groups
      OIDC_ATTRIBUTE_MAP: region=region,department=department
      OIDC_ALLOW_INSECURE: "true" # local demo over http only; never in a real deployment
    networks: [local, edge]
    depends_on:
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["identity-demo"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./scripts/oidc/realm-text2sql.json:/opt/keycloak/data/import/realm-text2sql.json:ro
    networks: [local, edge]

networks:
  edge: {}
