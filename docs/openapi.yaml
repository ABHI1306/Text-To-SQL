openapi: 3.1.0
info:
  title: Text-to-SQL Platform API
  version: 0.6.0
  description: Local authentication, PostgreSQL setup, semantic deployment, role, compile-preview, row-policy and audit APIs.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded; refresh token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      description: >
        Starts OpenID Connect sign-in (authorization code flow with PKCE, state and nonce) and
        redirects to the identity provider. Sets a short-lived HttpOnly SameSite=Lax
        `oidc_state` cookie that the callback must match. 404 when OIDC is not configured.
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      description: >
        Completes OIDC sign-in. The state is single-use and expires after ten minutes; the ID
        token is validated (signature via JWKS, iss, aud, exp, nonce) and the person's groups are
        mapped to a role through the `oidc` identity mappings, re-evaluated on every login. The
        session issued is the same as `/auth/login`.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Signed in; refresh token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Rotated refresh token and issued a new access token.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Refresh session revoked and cookie cleared.
  /auth/change-password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other refresh sessions revoked.
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Signed-in account profile, capabilities, and accessible projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /connections/test:
    post:
      operationId: testConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "200":
          description: Read-only connection verified.
          content:
            application/json:
              schema:
                type: object
                required: [server_version, latency_ms]
                properties:
                  server_version:
                    type: string
                  latency_ms:
                    type: integer
        "422":
          $ref: "#/components/responses/Error"
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects available to the current account.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "201":
          description: Connection tested and project credentials encrypted before saving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getSetupState
      responses:
        "200":
          description: Current setup step and saved table selection.
          content:
            application/json:
              schema:
                type: object
                required: [project_id, step, selected_tables]
                properties:
                  project_id:
                    type: string
                    format: uuid
                  step:
                    type: string
                    enum: [connect, tables, relationships, complete]
                  selected_tables:
                    type: array
                    items:
                      $ref: "#/components/schemas/SelectedTable"
  /projects/{project_id}/catalog/tables:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listCatalogTables
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: schema
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated catalog table list.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogTable"
                  page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
  /projects/{project_id}/selected-tables:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: saveSelectedTables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tables]
              properties:
                tables:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/SelectedTable"
      responses:
        "200":
          description: Unique, existing tables selected for profiling.
          content:
            application/json:
              schema:
                type: object
                required: [project_id, step, selected_count]
                properties:
                  project_id:
                    type: string
                    format: uuid
                  step:
                    type: string
                  selected_count:
                    type: integer
  /projects/{project_id}/introspect:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: introspectProject
      responses:
        "200":
          description: Catalog profile and reviewable semantic model draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfiledDraft"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/mdl:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getMdl
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Latest or selected saved semantic-model revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mdl"
    put:
      operationId: saveMdl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MdlDocument"
      responses:
        "200":
          description: Validated semantic model saved as a new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mdl"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/deploy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: deployProjectMdl
      parameters:
        - name: revision
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Indexed and activated semantic-model revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  version:
                    type: integer
                  indexed_chunks:
                    type: integer
                  previous_version:
                    type: string
                    nullable: true
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/query:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: askQuestion
      description: >
        Runs the question through the agent graph (retrieve, generate, compile under the caller's
        row policies, validate with a dry run, execute). Returns the logical SQL; the compiled SQL
        is included only for accounts holding `rerun_sql`. A typed failure is HTTP 422 (503 for
        LLM_UNAVAILABLE) with `{code, message, retryable}` in `detail`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Rows for the question.
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/query/stream:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: askQuestionStream
      description: >
        Same pipeline as `/query`, as server-sent events in this order (steps repeat on
        correction): retrieval, sql_candidate, compilation, validation, correction, rows, then
        done or error. Every step event carries `ms`. `compilation.sql` is sent only to accounts
        holding `rerun_sql`. `rewrite` (follow-ups only), `clarification` and `answer` replace the SQL steps when the
        message needs a question back or no query; `suggestions` is defined for the
        conversation work and is not emitted yet. `retrieval` lists the approved SQL pairs
        (`{id, question}`) and active instructions (`{id, text}`) given to the model. After
        `rows`, `summary` (`{text}`, only numbers that are in the rows) and `chart`
        (`{spec}`, a Vega-Lite spec validated against the result columns, bound to the dataset
        named `rows`) are sent when the small model produced valid ones; they are optional and
        never replace or delay the rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
  /identity/mappings:
    get:
      operationId: listIdentityMappings
      responses:
        "200":
          description: LDAP/OIDC group-to-role mappings.
    put:
      operationId: replaceIdentityMappings
      description: >
        Replaces all mappings of one source. The first matching mapping (in the order given)
        decides the role, and mappings are re-applied at each login, so removing someone from a
        group removes the role at their next login. A caller cannot map a role holding
        capabilities they lack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, mappings]
              properties:
                source:
                  type: string
                  enum: [ldap, oidc]
                mappings:
                  type: array
                  items:
                    type: object
                    required: [match, role]
                    properties:
                      match:
                        type: string
                        description: Group name or DN.
                      role:
                        type: string
      responses:
        "200":
          description: Mappings replaced.
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /roles:
    get:
      operationId: listRoles
      responses:
        "200":
          description: System and custom roles with capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "201":
          description: Custom role created.
        "409":
          $ref: "#/components/responses/Error"
  /roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: Custom role updated.
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRole
      responses:
        "204":
          description: Custom role deleted.
        "409":
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Local accounts and assigned roles.
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: Local account created; password change is required at first sign-in.
        "409":
          $ref: "#/components/responses/Error"
  /users/{user_id}/role:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: assignUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
      responses:
        "200":
          description: Role assigned.
  /users/{user_id}/project-access:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserProjectAccess
      responses:
        "200":
          description: Project access assigned directly to the user.
    put:
      operationId: setUserProjectAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAccessRequest"
      responses:
        "200":
          description: Direct project access replaced.
  /users/{user_id}/attributes:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserAttributes
      responses:
        "200":
          description: User attributes.
    put:
      operationId: setUserAttributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributes]
              properties:
                attributes:
                  type: object
      responses:
        "200":
          description: Attributes replaced.
  /roles/{role_id}/project-access:
    parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRoleProjectAccess
      responses:
        "200":
          description: Projects granted to the role.
    put:
      operationId: setRoleProjectAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAccessRequest"
      responses:
        "200":
          description: Role project access replaced.
  /capabilities:
    get:
      operationId: listCapabilities
      description: Capability catalogue for the custom role editor. Needs `manage_roles`.
      responses:
        "200":
          description: Sorted capability names.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/Error"
  /users/{user_id}/unlock:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: unlockUser
      description: Clears the failed-login lockout. Audited as `user_unlocked`. Needs `manage_users`.
      responses:
        "200":
          description: Account unlocked.
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /users/{user_id}/reset-password:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resetUserPassword
      description: >
        Sets a temporary password for a local account, revokes its sessions and requires a change
        at next sign-in. Audited as `user_password_reset`. Needs `manage_users`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 12
                  format: password
      responses:
        "200":
          description: Password reset; the user must change it at next sign-in.
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/knowledge/instructions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listInstructions
      description: Needs `manage_knowledge`.
      responses:
        "200":
          description: Instructions of the project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeInstruction"
    post:
      operationId: createInstruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInstructionRequest"
      responses:
        "201":
          description: Instruction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeInstruction"
  /projects/{project_id}/knowledge/instructions/{instruction_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: instruction_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateInstruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInstructionRequest"
      responses:
        "200":
          description: Instruction updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeInstruction"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteInstruction
      responses:
        "204":
          description: Instruction deleted.
        "404":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/knowledge/sql-pairs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listSqlPairs
      responses:
        "200":
          description: Approved question and SQL pairs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SqlPair"
    post:
      operationId: createSqlPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlPairRequest"
      responses:
        "201":
          description: Pair created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlPair"
  /projects/{project_id}/knowledge/sql-pairs/{pair_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: pair_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteSqlPair
      responses:
        "204":
          description: Pair deleted.
        "404":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/knowledge/proposals:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listPairProposals
      responses:
        "200":
          description: Pending proposals, each with the nearest approved pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PairProposalItem"
  /projects/{project_id}/knowledge/proposals/{proposal_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: approveProposal
      responses:
        "200":
          description: Proposal approved and promoted to an SQL pair.
        "404":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/knowledge/proposals/{proposal_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rejectProposal
      responses:
        "200":
          description: Proposal rejected.
        "404":
          $ref: "#/components/responses/Error"
  /sample-projects:
    get:
      operationId: listSampleProjectTemplates
      responses:
        "200":
          description: Available seeded project templates.
  /sample-projects/{template_id}:
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          enum: [ecommerce, human-resources]
    post:
      operationId: createSampleProject
      responses:
        "201":
          description: Sample project and initial semantic model created.
        "503":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/compile-preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: compilePreview
      description: >
        Compile logical SQL against the latest saved semantic model, or against an unsaved
        draft passed in `mdl`. Compile failures are returned inline with `ok: false`.
        With `previewAsUserId` the enabled row policies apply for that user; the preview is
        labeled and audited as `preview_as_user`. `sample` runs the compiled SQL read-only
        and returns at most 10 rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logicalSql]
              properties:
                logicalSql:
                  type: string
                  maxLength: 20000
                mdl:
                  type: object
                  description: Unsaved draft MDL, for the canvas and metrics live check.
                previewAsUserId:
                  type: string
                  format: uuid
                sample:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Compiled query or typed compile errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompilePreview"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/deploy-report:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getDeployReport
      description: >
        Description coverage, models needing review and compiler checks (calculated fields,
        metrics, relationships) of a saved revision. `deployable` is false when a check fails.
      parameters:
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Deploy report.
        "404":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/row-policies:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listRowPolicies
      responses:
        "200":
          description: Row policies of the project.
    post:
      operationId: createRowPolicy
      description: >
        Saving compiles the predicate for `testUserId` and rejects it when it does not parse,
        uses columns outside the model or unknown attributes. Writes a `row_policy_created`
        audit event in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowPolicyRequest"
      responses:
        "201":
          description: Policy stored, with validation warnings and the test compilation.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/row-policies/{policy_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateRowPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowPolicyRequest"
      responses:
        "200":
          description: Policy updated; the audit event records the previous predicate.
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRowPolicy
      responses:
        "204":
          description: Policy deleted and audited.
        "404":
          $ref: "#/components/responses/Error"
  /audit:
    get:
      operationId: browseAudit
      description: Newest first. Pass the previous `nextCursor` as `cursor` for the next page.
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/knowledge/instructions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listInstructions
      description: Requires `manage_knowledge`. Instructions of this project only.
      responses:
        "200":
          description: Instructions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instruction"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInstruction
      description: >
        Requires `manage_knowledge`. Active instructions are embedded and added, as delimited
        data, to the generation and correction prompts. Writes an `instruction_created` audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                active: { type: boolean, default: true }
      responses:
        "201":
          description: Instruction stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instruction"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/knowledge/instructions/{instruction_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: instruction_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateInstruction
      description: Requires `manage_knowledge`. Audited as `instruction_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                active: { type: boolean }
      responses:
        "200":
          description: Instruction updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instruction"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteInstruction
      description: Requires `manage_knowledge`. Audited as `instruction_deleted`.
      responses:
        "204":
          description: Instruction deleted.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/knowledge/sql-pairs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listSqlPairs
      description: Requires `manage_knowledge`. Approved pairs only; proposals are under `/knowledge/proposals`.
      responses:
        "200":
          description: Approved question and logical-SQL pairs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SqlPair"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSqlPair
      description: >
        Requires `approve_pairs`, because a pair added by hand is approved immediately. The SQL must
        compile against the deployed semantic model (logical names only), otherwise 422
        `INVALID_SQL`. A duplicate is 409. Audited as `sql_pair_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, logical_sql]
              properties:
                question: { type: string, minLength: 1, maxLength: 2000 }
                logical_sql: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        "201":
          description: Pair approved and indexed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlPair"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/knowledge/sql-pairs/{pair_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: pair_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteSqlPair
      description: Requires `manage_knowledge`. Audited as `sql_pair_deleted`.
      responses:
        "204":
          description: Pair deleted and removed from the index.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/feedback:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: giveFeedback
      description: >
        Requires `give_feedback`. A thumbs-up proposes the question and its logical SQL as a pair
        (status `proposed`, not used by retrieval until approved); a thumbs-down is only recorded.
        The SQL must compile against the deployed model. Audited as `feedback_given` and, for a
        new proposal, `sql_pair_proposed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, question, logical_sql]
              description: Give `message_id` or `thread_id` (or both).
              properties:
                message_id: { type: string, maxLength: 100 }
                thread_id: { type: string, format: uuid }
                rating: { type: string, enum: [up, down] }
                question: { type: string, minLength: 1, maxLength: 2000 }
                logical_sql: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        "201":
          description: Feedback stored; `proposal` is the pair now awaiting review, or null.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/knowledge/proposals:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProposals
      description: Requires `approve_pairs`. Each proposal carries `nearest_approved`, the closest approved pair (or null).
      responses:
        "200":
          description: Proposed pairs, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/SqlPair"
                    - type: object
                      properties:
                        nearest_approved:
                          nullable: true
                          allOf:
                            - $ref: "#/components/schemas/SqlPair"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/knowledge/proposals/{pair_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: pair_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveProposal
      description: Requires `approve_pairs`. The SQL is re-checked against the current model. Audited as `sql_pair_approved`.
      responses:
        "200":
          description: Pair approved and indexed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlPair"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/knowledge/proposals/{pair_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: pair_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectProposal
      description: Requires `approve_pairs`. Audited as `sql_pair_rejected` (with the reason).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Proposal rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlPair"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /threads:
    post:
      operationId: createThread
      description: Planned contract; thread persistence is not implemented yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Thread created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
  /threads/{thread_id}/ask:
    parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: askQuestion
      description: Planned contract; question execution is not implemented yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
      responses:
        "501":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/profiling-schedule:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProfilingSchedule
      description: The project's scheduled profiling and drift-detection job. Needs `manage_profiling`.
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilingSchedule"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: setProfilingSchedule
      description: >
        Creates or replaces the schedule. The job runs as the caller; if that account is later
        disabled or loses access the job pauses instead of running. Needs `manage_profiling`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule]
              additionalProperties: false
              properties:
                schedule:
                  type: string
                  description: Five-field cron expression, at most every 15 minutes.
                  example: "0 3 * * *"
                timezone:
                  type: string
                  default: UTC
      responses:
        "200":
          description: The saved schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilingSchedule"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfilingSchedule
      responses:
        "204":
          description: Schedule removed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/drift-reports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listDriftReports
      description: >
        Reports comparing the live catalog with the deployed MDL, newest first (including runs
        that found no drift). Needs `manage_profiling`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of reports.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DriftReport"
                  nextCursor:
                    type: string
                    format: date-time
                    nullable: true
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/drift-reports/{report_id}/draft:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createDraftFromDrift
      description: >
        Applies the report's findings to the MDL revision it compared and saves the result as a
        new draft revision (one per report). 409 when the report found no drift, already has a
        draft, or the drift cannot be applied without breaking calculated columns, metrics or
        relationships. Needs `edit_mdl`.
      responses:
        "201":
          description: The new draft revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                    format: uuid
                  reportId:
                    type: string
                    format: uuid
                  revision:
                    type: integer
                  baseRevision:
                    type: integer
                  status:
                    type: string
                    enum: [draft]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Instruction:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
    SqlPair:
      type: object
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        logical_sql: { type: string }
        status: { type: string, enum: [proposed, approved, rejected] }
        source: { type: string, enum: [manual, feedback] }
        proposed_by: { type: string, format: uuid, nullable: true }
        decided_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
    CompileError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - NON_SELECT
            - SYNTAX_ERROR
            - UNKNOWN_MODEL
            - UNKNOWN_COLUMN
            - DISALLOWED_FUNCTION
            - JOIN_NOT_ALLOWED
            - INVALID_MODEL
            - POLICY_ERROR
        message:
          type: string
        identifier:
          type: [string, "null"]
        suggestions:
          type: array
          items:
            type: string
    CompilePreview:
      type: object
      required: [ok, sql, parameters, errors, preview]
      properties:
        ok:
          type: boolean
        sql:
          type: string
        parameters:
          type: object
        policyContext:
          type: string
        appliedPolicies:
          type: array
          items:
            type: string
        missingAttributes:
          type: array
          items:
            type: string
        physicalRelations:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CompileError"
        preview:
          type: object
          properties:
            asUserId:
              type: [string, "null"]
            labeled:
              type: boolean
        sample:
          type: object
          properties:
            columns:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
                items: {}
            truncated:
              type: boolean
            error:
              type: string
    RowPolicyRequest:
      type: object
      required: [name, model, predicate, testUserId]
      properties:
        name:
          type: string
        model:
          type: string
        predicate:
          type: string
          description: "Boolean SQL over the model's columns; {{ user.<attribute> }} becomes a bound parameter."
        appliesTo:
          type: object
          properties:
            roles:
              type: array
              items:
                type: string
            exemptRoles:
              type: array
              items:
                type: string
        enabled:
          type: boolean
          default: true
        testUserId:
          type: string
          format: uuid
    KnowledgeInstructionRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
    KnowledgeInstruction:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
    SqlPairRequest:
      type: object
      required: [question, sql]
      properties:
        question:
          type: string
        sql:
          type: string
    SqlPair:
      type: object
      required: [id, question, sql]
      properties:
        id:
          type: string
        question:
          type: string
        sql:
          type: string
        created_at:
          type: string
          format: date-time
    PairProposal:
      type: object
      required: [id, question, sql]
      properties:
        id:
          type: string
        question:
          type: string
        sql:
          type: string
        status:
          type: string
        proposed_by:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    PairProposalItem:
      description: The proposal fields, or `{proposal, nearest_approved}`; the UI accepts both shapes.
      allOf:
        - $ref: "#/components/schemas/PairProposal"
        - type: object
          properties:
            nearest_approved:
              oneOf:
                - $ref: "#/components/schemas/SqlPair"
                - type: "null"
    AuditPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              actorId: { type: [string, "null"] }
              action: { type: string }
              resourceType: { type: string }
              resourceId: { type: string }
              details: { type: object }
              createdAt: { type: string, format: date-time }
        nextCursor:
          type: [integer, "null"]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
    RoleRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9 _-]*$"
        description:
          type: string
          maxLength: 500
        capabilities:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
    UserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: "^[A-Za-z0-9_.@-]+$"
        password:
          type: string
          minLength: 12
          format: password
        role:
          type: string
          default: User
    ProjectAccessRequest:
      type: object
      additionalProperties: false
      required: [project_ids]
      properties:
        project_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, must_change_password]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
        must_change_password:
          type: boolean
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
    ConnectionRequest:
      type: object
      additionalProperties: false
      required: [displayName, host, username, password, database]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
        database:
          type: string
          minLength: 1
          maxLength: 128
        ssl:
          type: boolean
          default: false
        sslCaCertificate:
          type: [string, "null"]
          maxLength: 64000
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        setup_step:
          type: string
          enum: [connect, tables, relationships, complete]
    CatalogTable:
      type: object
      required: [schema, table, approx_rows, column_count]
      properties:
        schema:
          type: string
        table:
          type: string
        approx_rows:
          type: integer
        column_count:
          type: integer
    SelectedTable:
      type: object
      additionalProperties: false
      required: [schema, table]
      properties:
        schema:
          type: string
          minLength: 1
        table:
          type: string
          minLength: 1
    ProfiledDraft:
      type: object
      required: [mdl, tables, summary]
      properties:
        mdl:
          $ref: "#/components/schemas/MdlDocument"
        tables:
          type: array
          items:
            type: object
            required: [schema_name, table_name, row_count, sample_rows]
            properties:
              schema_name:
                type: string
              table_name:
                type: string
              row_count:
                type: integer
              sample_rows:
                type: array
                items:
                  type: object
                  additionalProperties: true
        summary:
          type: object
          required: [selected_tables, total_rows, models_needing_review]
          properties:
            selected_tables:
              type: integer
            total_rows:
              type: integer
            models_needing_review:
              type: array
              items:
                type: string
    Me:
      type: object
      required: [user_id, username, role, capabilities, projects, must_change_password]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        capabilities:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        must_change_password:
          type: boolean
    MdlDocument:
      type: object
      required: [models]
      properties:
        version:
          type: integer
          minimum: 1
          default: 3
        dialect:
          type: string
          default: postgresql
        models:
          type: array
          items:
            type: object
            additionalProperties: true
        relationships:
          type: array
          items:
            type: object
            additionalProperties: true
        metrics:
          type: array
          items:
            type: object
            additionalProperties: true
        instructions:
          type: array
          items:
            type: string
        layout:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number
    Mdl:
      allOf:
        - $ref: "#/components/schemas/MdlDocument"
        - type: object
          required: [project_id, revision]
          properties:
            project_id:
              type: string
              format: uuid
            revision:
              type: integer
    Thread:
      type: object
      required: [id, project_id, title]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
    ProfilingSchedule:
      type: object
      required: [id, projectId, kind, schedule, timezone, status, nextRunAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum: [profile_drift]
        schedule:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [active, paused]
        pausedReason:
          type: string
          nullable: true
          description: For example owner_unavailable or owner_lacks_access.
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastStatus:
          type: string
          nullable: true
          enum: [succeeded, failed, skipped]
    DriftFinding:
      type: object
      required: [kind, table, model]
      properties:
        kind:
          type: string
          enum: [table_removed, column_removed, column_added, type_changed]
        table:
          type: string
        model:
          type: string
        column:
          type: string
        expected:
          type: string
          description: Type recorded in the MDL.
        actual:
          type: string
          description: Type found in the database.
        isPrimaryKey:
          type: boolean
    DriftReport:
      type: object
      required: [id, projectId, mdlVersion, hasDrift, summary, findings, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        mdlVersion:
          type: integer
          description: The deployed revision that was compared.
        hasDrift:
          type: boolean
        summary:
          type: object
          additionalProperties:
            type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DriftFinding"
        draftMdlVersion:
          type: integer
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        detail:
          description: FastAPI error detail.
          oneOf:
            - type: string
            - type: object
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
security:
  - bearerAuth: []
