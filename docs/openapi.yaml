openapi: 3.1.0
info:
  title: Text-to-SQL Platform API
  version: 0.3.0
  description: Local authentication, PostgreSQL setup, semantic deployment, and role APIs.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded; refresh token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Rotated refresh token and issued a new access token.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Refresh session revoked and cookie cleared.
  /auth/change-password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other refresh sessions revoked.
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Signed-in account profile, capabilities, and accessible projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /connections/test:
    post:
      operationId: testConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "200":
          description: Read-only connection verified.
          content:
            application/json:
              schema:
                type: object
                required: [server_version, latency_ms]
                properties:
                  server_version:
                    type: string
                  latency_ms:
                    type: integer
        "422":
          $ref: "#/components/responses/Error"
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects available to the current account.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "201":
          description: Connection tested and project credentials encrypted before saving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getSetupState
      responses:
        "200":
          description: Current setup step and saved table selection.
          content:
            application/json:
              schema:
                type: object
                required: [project_id, step, selected_tables]
                properties:
                  project_id:
                    type: string
                    format: uuid
                  step:
                    type: string
                    enum: [connect, tables, relationships, complete]
                  selected_tables:
                    type: array
                    items:
                      $ref: "#/components/schemas/SelectedTable"
  /projects/{project_id}/catalog/tables:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listCatalogTables
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: schema
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated catalog table list.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogTable"
                  page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
  /projects/{project_id}/selected-tables:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: saveSelectedTables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tables]
              properties:
                tables:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/SelectedTable"
      responses:
        "200":
          description: Unique, existing tables selected for profiling.
          content:
            application/json:
              schema:
                type: object
                required: [project_id, step, selected_count]
                properties:
                  project_id:
                    type: string
                    format: uuid
                  step:
                    type: string
                  selected_count:
                    type: integer
  /projects/{project_id}/introspect:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: introspectProject
      responses:
        "200":
          description: Catalog profile and reviewable semantic model draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfiledDraft"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/mdl:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getMdl
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Latest or selected saved semantic-model revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mdl"
    put:
      operationId: saveMdl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MdlDocument"
      responses:
        "200":
          description: Validated semantic model saved as a new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mdl"
        "422":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/deploy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: deployProjectMdl
      parameters:
        - name: revision
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Indexed and activated semantic-model revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  version:
                    type: integer
                  indexed_chunks:
                    type: integer
                  previous_version:
                    type: string
                    nullable: true
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /projects/{project_id}/query:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: askProjectQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: SQL and results returned from the connected PostgreSQL project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - sql
                  - columns
                  - rows
                  - retrieved_models
                  - model_version
                  - elapsed_ms
                  - truncated
                  - source
                properties:
                  sql:
                    type: string
                  columns:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: array
                      items: {}
                  retrieved_models:
                    type: array
                    items:
                      type: string
                  model_version:
                    type: integer
                  elapsed_ms:
                    type: integer
                  truncated:
                    type: boolean
                  source:
                    type: string
                    const: postgresql
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /roles:
    get:
      operationId: listRoles
      responses:
        "200":
          description: System and custom roles with capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "201":
          description: Custom role created.
        "409":
          $ref: "#/components/responses/Error"
  /roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: Custom role updated.
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRole
      responses:
        "204":
          description: Custom role deleted.
        "409":
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Local accounts and assigned roles.
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: Local account created; password change is required at first sign-in.
        "409":
          $ref: "#/components/responses/Error"
  /users/{user_id}/role:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: assignUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
      responses:
        "200":
          description: Role assigned.
  /users/{user_id}/project-access:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserProjectAccess
      responses:
        "200":
          description: Project access assigned directly to the user.
    put:
      operationId: setUserProjectAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAccessRequest"
      responses:
        "200":
          description: Direct project access replaced.
  /users/{user_id}/attributes:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserAttributes
      responses:
        "200":
          description: User attributes.
    put:
      operationId: setUserAttributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributes]
              properties:
                attributes:
                  type: object
      responses:
        "200":
          description: Attributes replaced.
  /roles/{role_id}/project-access:
    parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRoleProjectAccess
      responses:
        "200":
          description: Projects granted to the role.
    put:
      operationId: setRoleProjectAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAccessRequest"
      responses:
        "200":
          description: Role project access replaced.
  /sample-projects:
    get:
      operationId: listSampleProjectTemplates
      responses:
        "200":
          description: Available seeded project templates.
  /sample-projects/{template_id}:
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          enum: [ecommerce, human-resources]
    post:
      operationId: createSampleProject
      responses:
        "201":
          description: Sample project and initial semantic model created.
        "503":
          $ref: "#/components/responses/Error"
  /threads:
    post:
      operationId: createThread
      description: Planned contract; thread persistence is not implemented yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Thread created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
  /threads/{thread_id}/ask:
    parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: askQuestion
      description: Planned contract; question execution is not implemented yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
      responses:
        "501":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
    RoleRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9 _-]*$"
        description:
          type: string
          maxLength: 500
        capabilities:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
    UserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: "^[A-Za-z0-9_.@-]+$"
        password:
          type: string
          minLength: 12
          format: password
        role:
          type: string
          default: User
    ProjectAccessRequest:
      type: object
      additionalProperties: false
      required: [project_ids]
      properties:
        project_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, must_change_password]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
        must_change_password:
          type: boolean
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
    ConnectionRequest:
      type: object
      additionalProperties: false
      required: [displayName, host, username, password, database]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
        database:
          type: string
          minLength: 1
          maxLength: 128
        ssl:
          type: boolean
          default: false
        sslCaCertificate:
          type: [string, "null"]
          maxLength: 64000
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        setup_step:
          type: string
          enum: [connect, tables, relationships, complete]
    CatalogTable:
      type: object
      required: [schema, table, approx_rows, column_count]
      properties:
        schema:
          type: string
        table:
          type: string
        approx_rows:
          type: integer
        column_count:
          type: integer
    SelectedTable:
      type: object
      additionalProperties: false
      required: [schema, table]
      properties:
        schema:
          type: string
          minLength: 1
        table:
          type: string
          minLength: 1
    ProfiledDraft:
      type: object
      required: [mdl, tables, summary]
      properties:
        mdl:
          $ref: "#/components/schemas/MdlDocument"
        tables:
          type: array
          items:
            type: object
            required: [schema_name, table_name, row_count, sample_rows]
            properties:
              schema_name:
                type: string
              table_name:
                type: string
              row_count:
                type: integer
              sample_rows:
                type: array
                items:
                  type: object
                  additionalProperties: true
        summary:
          type: object
          required: [selected_tables, total_rows, models_needing_review]
          properties:
            selected_tables:
              type: integer
            total_rows:
              type: integer
            models_needing_review:
              type: array
              items:
                type: string
    Me:
      type: object
      required: [user_id, username, role, capabilities, projects, must_change_password]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        capabilities:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        must_change_password:
          type: boolean
    MdlDocument:
      type: object
      required: [models]
      properties:
        version:
          type: integer
          minimum: 1
          default: 3
        dialect:
          type: string
          default: postgresql
        models:
          type: array
          items:
            type: object
            additionalProperties: true
        relationships:
          type: array
          items:
            type: object
            additionalProperties: true
        metrics:
          type: array
          items:
            type: object
            additionalProperties: true
        instructions:
          type: array
          items:
            type: string
        layout:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number
    Mdl:
      allOf:
        - $ref: "#/components/schemas/MdlDocument"
        - type: object
          required: [project_id, revision]
          properties:
            project_id:
              type: string
              format: uuid
            revision:
              type: integer
    Thread:
      type: object
      required: [id, project_id, title]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
    Error:
      type: object
      properties:
        detail:
          description: FastAPI error detail.
          oneOf:
            - type: string
            - type: object
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
security:
  - bearerAuth: []
